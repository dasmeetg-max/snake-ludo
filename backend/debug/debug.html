<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Snake Ludo Debug</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: monospace;
            background: #0d1117;
            color: #c9d1d9;
            padding: 24px;
            font-size: 13px;
        }

        h1 {
            color: #f85149;
            margin-bottom: 16px;
            font-size: 20px;
        }

        section {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }

        section h2 {
            color: #58a6ff;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid #30363d;
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        label {
            color: #8b949e;
            min-width: 80px;
        }

        input[type="number"] {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 5px 8px;
            border-radius: 4px;
            width: 64px;
            font-family: monospace;
            font-size: 13px;
        }

        button {
            background: #238636;
            border: none;
            color: #fff;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
            transition: background 0.15s;
        }

        button:hover {
            background: #2ea043;
        }

        button.danger {
            background: #b91c1c;
        }

        button.danger:hover {
            background: #dc2626;
        }

        button.neutral {
            background: #1f6feb;
        }

        button.neutral:hover {
            background: #388bfd;
        }

        .board-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            font-size: 12px;
            color: #8b949e;
        }

        .board-info span {
            color: #c9d1d9;
        }

        #log {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 4px;
            padding: 10px;
            height: 220px;
            overflow-y: auto;
            font-size: 11px;
            line-height: 1.6;
        }

        .log-out {
            color: #58a6ff;
        }

        .log-in {
            color: #3fb950;
        }

        .log-err {
            color: #f85149;
        }

        .log-info {
            color: #8b949e;
        }

        .scenarios {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 8px;
        }

        .scenario-btn {
            text-align: left;
            padding: 10px 12px;
            background: #1f2937;
            border: 1px solid #30363d;
            color: #c9d1d9;
            border-radius: 6px;
            cursor: pointer;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.5;
        }

        .scenario-btn:hover {
            background: #273548;
            border-color: #58a6ff;
        }

        .scenario-btn strong {
            color: #58a6ff;
            display: block;
            margin-bottom: 4px;
        }

        .scenario-btn small {
            color: #8b949e;
        }

        #status-bar {
            display: flex;
            gap: 16px;
            font-size: 12px;
            color: #8b949e;
            margin-bottom: 16px;
        }

        #status-bar .pill {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 3px 10px;
        }

        #status-bar .pill span {
            color: #3fb950;
        }
    </style>
</head>

<body>

    <h1>🐍 Snake Ludo — Debug Panel</h1>

    <div id="status-bar">
        <div class="pill">Socket: <span id="conn-status">connecting...</span></div>
        <div class="pill">Phase: <span id="game-phase">—</span></div>
        <div class="pill">Turn: <span id="current-turn">—</span></div>
        <div class="pill">Forced Dice: <span id="forced-dice">none</span></div>
    </div>

    <!-- Board Info -->
    <section>
        <h2>📋 Board Reference</h2>
        <div class="board-info" id="board-info">Loading...</div>
    </section>

    <!-- Dice -->
    <section>
        <h2>🎲 Force Dice</h2>
        <div class="row">
            <label>Value (1–6):</label>
            <input type="number" id="diceVal" value="1" min="1" max="6">
            <button onclick="forceDice()">Set Forced Dice</button>
            <button class="danger" onclick="clearDice()">Clear (random)</button>
        </div>
    </section>

    <!-- Teleport -->
    <section>
        <h2>📍 Teleport Token</h2>
        <div class="row">
            <label>Player:</label>
            <input type="number" id="tpPlayer" value="0" min="0" max="1">
            <label>Token:</label>
            <input type="number" id="tpToken" value="0" min="0" max="1">
            <label>Level:</label>
            <input type="number" id="tpLevel" value="1" min="1" max="3">
            <label>Tile:</label>
            <input type="number" id="tpTile" value="0" min="0">
            <button onclick="teleport()">Teleport</button>
        </div>
    </section>

    <!-- Game Control -->
    <section>
        <h2>⚙️ Game Control</h2>
        <div class="row">
            <button class="neutral" onclick="setPhase('playing')">Force Start</button>
            <button onclick="setPhase('waiting')">Reset to Waiting</button>
            <button class="danger" onclick="resetGame()">Full Reset</button>
            <button class="neutral" onclick="getState()">Print State</button>
        </div>
    </section>

    <!-- Set Turn -->
    <section>
        <h2>🎯 Set Turn</h2>
        <div class="row">
            <label>Player:</label>
            <input type="number" id="turnPlayer" value="0" min="0" max="1">
            <button onclick="setTurn()">Set Turn</button>
            <button class="neutral" onclick="setTurnAndLog(0)">→ P0's Turn</button>
            <button class="neutral" onclick="setTurnAndLog(1)">→ P1's Turn</button>
        </div>
    </section>

    <!-- Quick Scenarios -->
    <section>
        <h2>⚡ Quick Test Scenarios</h2>
        <div class="scenarios">

            <button class="scenario-btn" onclick="setupCollisionL1()">
                <strong>💥 Collision — L1</strong>
                <small>P0@L1:5 · P1@L1:4 · dice=1<br>Roll as P1 → P0 sent to L1:4</small>
            </button>

            <button class="scenario-btn" onclick="setupCollisionL2()">
                <strong>💥 Collision — L2</strong>
                <small>P0@L2:10 · P1@L2:9 · dice=1<br>Roll as P1 → P0 sent to L1:4</small>
            </button>

            <button class="scenario-btn" onclick="setupSafeCollision()">
                <strong>🛡️ Safe Zone — No Collision</strong>
                <small>P0@L1:8 (corner) · P1@L1:7 · dice=1<br>Roll as P1 → no collision</small>
            </button>

            <button class="scenario-btn" onclick="setupLadderB()">
                <strong>🪜 Ladder B — L1:11→L2:8</strong>
                <small>P0@L1:10 · dice=1<br>Roll as P0 → lands L1:11 → climbs L2:8</small>
            </button>

            <button class="scenario-btn" onclick="setupLadderD()">
                <strong>🪜 Ladder D — L1:27→L2:20</strong>
                <small>P1@L1:26 · dice=1<br>Roll as P1 → lands L1:27 → climbs L2:20</small>
            </button>

            <button class="scenario-btn" onclick="setupLadderA()">
                <strong>🪜 Ladder A — L2:4→L3:3</strong>
                <small>P1@L2:3 · dice=1<br>Roll as P1 → lands L2:4 → climbs L3:3</small>
            </button>

            <button class="scenario-btn" onclick="setupLadderC()">
                <strong>🪜 Ladder C — L2:16→L3:11</strong>
                <small>P0@L2:15 · dice=1<br>Roll as P0 → lands L2:16 → climbs L3:11</small>
            </button>

            <button class="scenario-btn" onclick="setupSnakeA()">
                <strong>🐍 Snake A — L2:1→L1:2</strong>
                <small>P0@L2:0 · dice=1<br>Roll as P0 → lands L2:1 → drops L1:2</small>
            </button>

            <button class="scenario-btn" onclick="setupSnakeC()">
                <strong>🐍 Snake C — L2:13→L1:18</strong>
                <small>P1@L2:12 · dice=1<br>Roll as P1 → lands L2:13 → drops L1:18</small>
            </button>

            <button class="scenario-btn" onclick="setupSnakeB()">
                <strong>🐍 Snake B — L3:6→L2:9</strong>
                <small>P0@L3:5 · dice=1<br>Roll as P0 → lands L3:6 → drops L2:9</small>
            </button>

            <button class="scenario-btn" onclick="setupSnakeD()">
                <strong>🐍 Snake D — L3:14→L2:21</strong>
                <small>P1@L3:13 · dice=1<br>Roll as P1 → lands L3:14 → drops L2:21</small>
            </button>

            <button class="scenario-btn" onclick="setupLevelUpP0()">
                <strong>⬆️ Level Up — P0 L1→L2</strong>
                <small>P0@L1:3 · dice=1<br>Roll as P0 → completes lap at L1:4 → L2:3</small>
            </button>

            <button class="scenario-btn" onclick="setupLevelUpP1()">
                <strong>⬆️ Level Up — P1 L1→L2</strong>
                <small>P1@L1:19 · dice=1<br>Roll as P1 → completes lap at L1:20 → L2:15</small>
            </button>

            <button class="scenario-btn" onclick="setupLevelUpP0M2()">
                <strong>⬆️ Level Up — P0 L2→L3</strong>
                <small>P0@L2:2 · dice=1<br>Roll as P0 → completes lap at L2:3 → L3:2</small>
            </button>

            <button class="scenario-btn" onclick="setupLevelUpP1M2()">
                <strong>⬆️ Level Up — P1 L2→L3</strong>
                <small>P1@L2:14 · dice=1<br>Roll as P1 → completes lap at L2:15 → L3:10</small>
            </button>

            <button class="scenario-btn" onclick="setupOvershoot()">
                <strong>🚫 Overshoot — L3 win</strong>
                <small>P0 T0@L3:15 (3 to home) · dice=5<br>Roll as P0, pick T0 → rejected</small>
            </button>

            <button class="scenario-btn" onclick="setupOvershootAutoPass()">
                <strong>⏭️ Overshoot — Auto-Pass</strong>
                <small>P0 T0@L3:15 · T1@L3:13 · dice=6<br>Roll as P0 → both overshoot → pass</small>
            </button>

        </div>
    </section>

    <!-- Log -->
    <section>
        <h2>📡 Event Log</h2>
        <div id="log"></div>
    </section>

    <script>
        const socket = io({ query: { role: "debug" } });

        // ── Status bar ────────────────────────────────────────────

        socket.on("connect", () => {
            document.getElementById("conn-status").textContent = "connected";
            document.getElementById("conn-status").style.color = "#3fb950";
            log("Connected: " + socket.id, "in");
            loadBoardInfo();
        });

        socket.on("disconnect", () => {
            document.getElementById("conn-status").textContent = "disconnected";
            document.getElementById("conn-status").style.color = "#f85149";
            log("Disconnected", "err");
        });

        socket.on("debugAck", (d) => {
            if (d.error) {
                log("❌ " + JSON.stringify(d), "err");
            } else {
                log("✅ " + JSON.stringify(d), "in");
                if (d.action === "setDice")
                    document.getElementById("forced-dice").textContent = d.value !== null ? d.value : "none";
                if (d.action === "setTurn")
                    document.getElementById("current-turn").textContent = "P" + d.playerIndex;
            }
        });

        socket.on("debugState", (d) => {
            document.getElementById("game-phase").textContent = d.gamePhase;
            document.getElementById("current-turn").textContent = "P" + d.currentPlayerIndex;
            document.getElementById("forced-dice").textContent = d.forcedDice ?? "none";
            log("📋 State: " + JSON.stringify(d, null, 2), "info");
        });

        socket.on("gameStart", (d) => {
            document.getElementById("game-phase").textContent = "playing";
            document.getElementById("current-turn").textContent = "P" + d.currentPlayerIndex;
            log("🚀 gameStart: P" + d.currentPlayerIndex + " goes first", "in");
        });

        socket.on("rollResult", (d) => {
            document.getElementById("current-turn").textContent = "P" + (d.nextPlayerIndex ?? d.playerIndex);
            log("🎲 rollResult: P" + d.playerIndex + " rolled " + d.roll + (d.autoPass ? " [AUTO-PASS]" : ""), "in");
        });

        socket.on("moveResult", (d) => {
            const r = d.moveResult;
            log("🎮 moveResult: " + r.type + " → " + JSON.stringify(r), "in");
            if (d.nextPlayerIndex !== null && d.nextPlayerIndex !== undefined) {
                document.getElementById("current-turn").textContent = "P" + d.nextPlayerIndex;
            }
        });

        socket.on("playerWon", (d) => {
            document.getElementById("game-phase").textContent = "finished";
            log("🏆 playerWon: P" + d.playerIndex, "in");
        });

        socket.on("error", (d) => log("⚠️ error: " + JSON.stringify(d), "err"));

        // ── Board info ────────────────────────────────────────────

        async function loadBoardInfo() {
            try {
                const res = await fetch("/debug/board");
                const data = await res.json();
                const el = document.getElementById("board-info");

                const ringLines = data.ringConfigs.map(r =>
                    `<div>L${r.level}: <span>${r.boardSize} tiles</span> | <span>${r.tilesPerSide}</span>/side | halfSide <span>${r.halfSide}</span></div>`
                ).join("");

                const safeLines = Object.entries(data.safeTiles).map(([level, tiles]) =>
                    `<div>Safe L${level}: <span>[${tiles.join(", ")}]</span></div>`
                ).join("");

                const ladderLines = data.ladders.map(l =>
                    `<div>🪜 L${l.fromLevel}:${l.fromTile} → L${l.toLevel}:${l.toTile}</div>`
                ).join("");

                const snakeLines = data.snakes.map(s =>
                    `<div>🐍 L${s.fromLevel}:${s.fromTile} → L${s.toLevel}:${s.toTile}</div>`
                ).join("");

                el.innerHTML = ringLines + safeLines + ladderLines + snakeLines;
            } catch (e) {
                document.getElementById("board-info").textContent = "Failed to load board info";
            }
        }

        // ── Controls ──────────────────────────────────────────────

        function forceDice() {
            const val = parseInt(document.getElementById("diceVal").value);
            socket.emit("debugSetDice", { value: val });
            log("→ debugSetDice: " + val, "out");
        }

        function clearDice() {
            socket.emit("debugSetDice", { value: null });
            log("→ debugSetDice: cleared", "out");
        }

        function teleport() {
            const data = {
                playerIndex: parseInt(document.getElementById("tpPlayer").value),
                tokenId: parseInt(document.getElementById("tpToken").value),
                level: parseInt(document.getElementById("tpLevel").value),
                tile: parseInt(document.getElementById("tpTile").value)
            };
            socket.emit("debugTeleport", data);
            log("→ debugTeleport: " + JSON.stringify(data), "out");
        }

        function setPhase(phase) {
            socket.emit("debugSetPhase", { phase });
            log("→ debugSetPhase: " + phase, "out");
        }

        function resetGame() {
            socket.emit("debugResetGame");
            log("→ debugResetGame", "out");
        }

        function getState() {
            socket.emit("debugGetState");
            log("→ debugGetState", "out");
        }

        // ── Scenarios ─────────────────────────────────────────────

        // Single teleport — used only by the manual Teleport form
        function tp(p, t, l, tile) { socket.emit("debugTeleport", { playerIndex: p, tokenId: t, level: l, tile }); }

        // Batch teleport — all positions sent in ONE event, no race condition possible
        function batch(teleports) { socket.emit("debugBatchTeleport", { teleports }); }

        function dice(v) { socket.emit("debugSetDice", { value: v }); }

        function setTurn() {
            const p = parseInt(document.getElementById("turnPlayer").value);
            socket.emit("debugSetTurn", { playerIndex: p });
            log("→ debugSetTurn: P" + p, "out");
        }

        function setTurnAndLog(p) {
            document.getElementById("turnPlayer").value = p;
            socket.emit("debugSetTurn", { playerIndex: p });
            log("→ debugSetTurn: P" + p, "out");
        }

        function turn(p) { socket.emit("debugSetTurn", { playerIndex: p }); }

        // Collision — P1 lands on P0 at a plain L1 tile.
        // P0 resets to its own L1 home (4), which is now itself a safe tile.
        function setupCollisionL1() {
            turn(1);
            batch([{ playerIndex: 0, tokenId: 0, level: 1, tile: 5 },
            { playerIndex: 1, tokenId: 0, level: 1, tile: 4 }]);
            dice(1);
            log("→ Collision L1: turn=P1 · P0@L1:5 · P1@L1:4 · dice=1 — roll as P1 → P0 sent to L1:4", "out");
        }

        // Collision one level in — L2:10 is plain (not safe, no ladder/snake).
        // A token knocked off L2 drops to L1 and resets to P0's L1 home.
        function setupCollisionL2() {
            turn(1);
            batch([{ playerIndex: 0, tokenId: 0, level: 2, tile: 10 },
            { playerIndex: 1, tokenId: 0, level: 2, tile: 9 }]);
            dice(1);
            log("→ Collision L2: turn=P1 · P0@L2:10 · P1@L2:9 · dice=1 — roll as P1 → P0 sent to L1:4", "out");
        }

        // L1:8 is a corner watchtower — P1 lands on P0 there and nothing happens.
        function setupSafeCollision() {
            turn(1);
            batch([{ playerIndex: 0, tokenId: 0, level: 1, tile: 8 },
            { playerIndex: 1, tokenId: 0, level: 1, tile: 7 }]);
            dice(1);
            log("→ Safe Zone: turn=P1 · P0@L1:8 (corner) · P1@L1:7 · dice=1 — roll as P1 → no collision", "out");
        }

        function setupLadderB() {
            turn(0);
            batch([{ playerIndex: 0, tokenId: 0, level: 1, tile: 10 }]);
            dice(1);
            log("→ Ladder B: turn=P0 · P0@L1:10 · dice=1 — roll as P0 → L1:11 → L2:8", "out");
        }

        function setupLadderD() {
            turn(1);
            batch([{ playerIndex: 1, tokenId: 0, level: 1, tile: 26 }]);
            dice(1);
            log("→ Ladder D: turn=P1 · P1@L1:26 · dice=1 — roll as P1 → L1:27 → L2:20", "out");
        }

        // Ladder A sits on P0's own face, but P0 cannot be staged in front of it:
        // L2:3 is P0's home, so P0 would level up rather than step onto L2:4.
        // P1 is 12 tiles from its own home there, so it just walks on.
        function setupLadderA() {
            turn(1);
            batch([{ playerIndex: 1, tokenId: 0, level: 2, tile: 3 }]);
            dice(1);
            log("→ Ladder A: turn=P1 · P1@L2:3 · dice=1 — roll as P1 → L2:4 → L3:3", "out");
        }

        function setupLadderC() {
            turn(0);
            batch([{ playerIndex: 0, tokenId: 0, level: 2, tile: 15 }]);
            dice(1);
            log("→ Ladder C: turn=P0 · P0@L2:15 · dice=1 — roll as P0 → L2:16 → L3:11", "out");
        }

        function setupSnakeA() {
            turn(0);
            batch([{ playerIndex: 0, tokenId: 0, level: 2, tile: 0 }]);
            dice(1);
            log("→ Snake A: turn=P0 · P0@L2:0 · dice=1 — roll as P0 → L2:1 → L1:2", "out");
        }

        function setupSnakeC() {
            turn(1);
            batch([{ playerIndex: 1, tokenId: 0, level: 2, tile: 12 }]);
            dice(1);
            log("→ Snake C: turn=P1 · P1@L2:12 · dice=1 — roll as P1 → L2:13 → L1:18", "out");
        }

        function setupSnakeB() {
            turn(0);
            batch([{ playerIndex: 0, tokenId: 0, level: 3, tile: 5 }]);
            dice(1);
            log("→ Snake B: turn=P0 · P0@L3:5 · dice=1 — roll as P0 → L3:6 → L2:9", "out");
        }

        function setupSnakeD() {
            turn(1);
            batch([{ playerIndex: 1, tokenId: 0, level: 3, tile: 13 }]);
            dice(1);
            log("→ Snake D: turn=P1 · P1@L3:13 · dice=1 — roll as P1 → L3:14 → L2:21", "out");
        }

        // Lap completion: one step short of the L1 home tile, so the roll lands
        // exactly on it and the token crosses the bridge to the L2 home.
        function setupLevelUpP0() {
            turn(0);
            batch([{ playerIndex: 0, tokenId: 0, level: 1, tile: 3 }]);
            dice(1);
            log("→ Level Up P0: turn=P0 · P0@L1:3 · dice=1 — roll as P0 → L1:4 completes lap → L2:3", "out");
        }

        function setupLevelUpP1() {
            turn(1);
            batch([{ playerIndex: 1, tokenId: 0, level: 1, tile: 19 }]);
            dice(1);
            log("→ Level Up P1: turn=P1 · P1@L1:19 · dice=1 — roll as P1 → L1:20 completes lap → L2:15", "out");
        }

        // Moat 2 bridge — same lap-completion path one ring in.
        function setupLevelUpP0M2() {
            turn(0);
            batch([{ playerIndex: 0, tokenId: 0, level: 2, tile: 2 }]);
            dice(1);
            log("→ Level Up P0 (moat 2): turn=P0 · P0@L2:2 · dice=1 — roll as P0 → L2:3 completes lap → L3:2", "out");
        }

        function setupLevelUpP1M2() {
            turn(1);
            batch([{ playerIndex: 1, tokenId: 0, level: 2, tile: 14 }]);
            dice(1);
            log("→ Level Up P1 (moat 2): turn=P1 · P1@L2:14 · dice=1 — roll as P1 → L2:15 completes lap → L3:10", "out");
        }

        // T0 is 3 from home on the final ring, so a 5 overshoots and the server
        // rejects moveToken. T1 stays at start and can still move, so no auto-pass.
        function setupOvershoot() {
            turn(0);
            batch([{ playerIndex: 0, tokenId: 0, level: 3, tile: 15 },
            { playerIndex: 0, tokenId: 1, level: 1, tile: 4 }]);
            dice(5);
            log("→ Overshoot: turn=P0 · P0 T0@L3:15 (3 to home) · T1@L1:4 · dice=5 — pick T0 → rejected", "out");
        }

        // Both tokens overshoot (3 and 5 steps from home, dice 6) → auto-pass.
        function setupOvershootAutoPass() {
            turn(0);
            batch([{ playerIndex: 0, tokenId: 0, level: 3, tile: 15 },
            { playerIndex: 0, tokenId: 1, level: 3, tile: 13 }]);
            dice(6);
            log("→ Overshoot auto-pass: turn=P0 · T0@L3:15 · T1@L3:13 · dice=6 — roll as P0 → auto-pass to P1", "out");
        }

        // ── Log helper ────────────────────────────────────────────

        function log(msg, type = "info") {
            const el = document.getElementById("log");
            const div = document.createElement("div");
            div.className = "log-" + type;
            div.textContent = new Date().toLocaleTimeString() + "  " + msg;
            el.prepend(div);
        }
    </script>
</body>

</html>
